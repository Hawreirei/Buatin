name: CI dan GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tes Python (data, blueprint, konten, bank soal)
        run: python -W error -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tes JavaScript (aplikasi)
        run: node --test tests/js/*.test.mjs
      - name: Bangun situs statis
        run: python scripts/build_site.py --out _site
      - name: Unggah artefak Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Hanya branch default yang dipublikasikan (aturan environment github-pages).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
