# Source: 新版HSK（1-6级）考试结构与样题示例, CTI (汉考国际), released 2025-12, in force 2026-07.
# Section question counts, part counts and times are from the official "考试结构" tables.
# Part "type" names are our own labels, derived from the official sample questions.
# Scoring is NOT specified in that document -> omitted until the official scoring rules are obtained.
exam: hsk
syllabus: "3.0"
level: 1
verified: true
vocab_cumulative: 300
total_questions: 40
total_time_min: 40          # includes personal-info + answer-sheet time
sections:
  - id: listening
    skill: listening
    time_min: 12            # "约 12"
    parts:
      - {id: L1, type: audio_phrase_pick_picture, count: 5}
      - {id: L2, type: audio_question_pick_answer, count: 5}
      - {id: L3, type: audio_dialog_match_picture, count: 5}
      - {id: L4, type: audio_statement_question_mcq, count: 5}
  - id: reading
    skill: reading
    time_min: 20
    parts:
      - {id: R1, type: sentence_match_picture, count: 5}
      - {id: R2, type: match_question_to_answer, count: 5}
      - {id: R3, type: cloze_wordbank, count: 5}
      - {id: R4, type: short_text_mcq, count: 5}
