# Source: 新版HSK（1-6级）考试结构与样题示例, CTI (汉考国际), released 2025-12, in force 2026-07.
# Section question counts, part counts and times are from the official "考试结构" tables.
# Part "type" names are our own labels, derived from the official sample questions.
# Scoring is NOT specified in that document -> omitted until the official scoring rules are obtained.
exam: hsk
syllabus: "3.0"
level: 2
verified: true
vocab_cumulative: 500
total_questions: 60
total_time_min: 60
sections:
  - id: listening
    skill: listening
    time_min: 17            # "约 17"
    parts:
      - {id: L1, type: audio_sentence_pick_picture, count: 5}
      - {id: L2, type: audio_dialog_match_picture, count: 10}
      - {id: L3, type: audio_dialog_question_mcq, count: 10}
  - id: reading
    skill: reading
    time_min: 25
    parts:
      - {id: R1, type: sentence_match_picture, count: 5}
      - {id: R2, type: cloze_wordbank, count: 5}
      - {id: R3, type: match_question_to_answer, count: 10}
      - {id: R4, type: short_text_mcq, count: 5}
  - id: writing
    skill: writing
    time_min: 10
    parts:
      - {id: W1, type: choose_missing_character_component, count: 5}
      - {id: W2, type: write_hanzi_from_pinyin, count: 5}
